services:

  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_demo

    ports:
      - "5433:5432"
#- "5432:5432"
    volumes:
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./init-db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  phasea-worker:
    build: ./phase_a
    container_name: phasea-worker

    env_file:
      - .env

    volumes:
      - ./data:/data

    depends_on:
      - postgres-db

  phaseb-api:
    build: ./phase_b
    container_name: phaseb-api

    env_file:
      - .env

    ports:
      - "8002:8000"

    depends_on:
      - postgres-db

  frontend:
    build: ./frontend
    container_name: frontend

    ports:
      - "5173:5173"

    depends_on:
      - phaseb-api